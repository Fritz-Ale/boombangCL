server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # All portal API calls stay on the public site's origin. Laravel's web
  # middleware owns session cookies, CSRF protection and authorization.
  # Do not expose the emulator's internal authentication token here.
  resolver 127.0.0.11 ipv6=off valid=10s;
  location ^~ /portal/ {
    set $portal_backend api:80;
    proxy_pass http://$portal_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  location ~ /\. {
    deny all;
  }

  location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
