name: Public scene runtime asset diagnostics

on:
  pull_request:
    paths:
      - 'api/app/Support/PublicSceneAssetDiagnostics.php'
      - 'api/routes/console.php'
      - 'api/tests/Standalone/public-scene-assets-health.php'
      - '.github/workflows/public-scenes-runtime-health.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check PHP syntax
        run: |
          php -l api/app/Support/PublicSceneAssetDiagnostics.php
          php -l api/routes/console.php
          php -l api/tests/Standalone/public-scene-assets-health.php
      - name: Check mounted scene file inspection
        run: php api/tests/Standalone/public-scene-assets-health.php
