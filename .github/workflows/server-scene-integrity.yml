name: Server scene integrity

on:
  pull_request:
    paths:
      - 'server/src/**'
      - 'server/tests/**'
      - '.github/workflows/server-scene-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse modified server modules
        run: |
          node --check server/src/utils/SceneMutex.js
          node --check server/src/models/SceneModel.js
          node --check server/src/controllers/game/scenes/SendUserToSceneController.js
      - name: Test concurrency, doors and navigation bounds
        run: node --test server/tests/scene-mutex.test.cjs server/tests/scene-transition.test.cjs server/tests/navigation-boundaries.test.cjs
