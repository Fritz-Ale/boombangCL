name: Server scene safety

on:
  pull_request:
    paths:
      - 'server/src/utils/SceneMutex.js'
      - 'server/tests/scene-mutex.test.cjs'
      - '.github/workflows/server-scene-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check server/src/utils/SceneMutex.js
      - name: Concurrent scene entry regression tests
        run: node --test server/tests/scene-mutex.test.cjs
