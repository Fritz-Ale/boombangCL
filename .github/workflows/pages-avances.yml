name: Publicar panel de avances - GitHub Pages

# Publica SOLO el panel estático, nunca Laravel ni pantallas de cuentas.
# Requiere habilitar Pages -> GitHub Actions en Settings del repositorio
# y disponer de un plan que permita Pages para repositorios privados.
on:
  workflow_dispatch:
  schedule:
    # Refresca la fotografía del estado al menos una vez al día tras fusionar a main.
    - cron: '15 9 * * *'
  push:
    branches: [main]
    paths:
      - "web/avance.html"
      - "web/avance.css"
      - "web/avance.js"
      - "web/avance-data.json"
      - "web/styles.css"
      - "web/portal.css"
      - "web/script.js"
      - ".github/workflows/pages-avances.yml"

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-avances
  cancel-in-progress: false

jobs:
  publish:
    # Opt-in required even after the PR is merged. Publishing the progress
    # status of a private repository must never be an accidental side-effect.
    if: vars.ENABLE_PROGRESS_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar exclusivamente el panel de avances
        run: node web/scripts/build-progress-bundle.mjs _site pages
      - name: Generar fotografía de GitHub (sin publicar token)
        env:
          PROGRESS_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node web/scripts/generate-progress-status.mjs _site/avance-github.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Desplegar panel de avances
        id: deployment
        uses: actions/deploy-pages@v4
