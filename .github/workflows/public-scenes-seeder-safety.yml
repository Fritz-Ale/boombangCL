name: Public scenes seeder safety

on:
  pull_request:
    paths:
      - 'api/database/seeders/PublicScenesTableSeeder.php'
      - 'api/tests/Standalone/public-scene-seeder.php'
      - '.github/workflows/public-scenes-seeder-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seeder:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax and nondestructive seed regression
        run: |
          php -l api/database/seeders/PublicScenesTableSeeder.php
          php -l api/tests/Standalone/public-scene-seeder.php
          php api/tests/Standalone/public-scene-seeder.php
