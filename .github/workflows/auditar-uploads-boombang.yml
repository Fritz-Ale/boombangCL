name: Auditoria temporal de uploads.zip (sin publicarlo)
on:
  push:
    paths:
      - '.github/workflows/auditar-uploads-boombang.yml'
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar ZIP original y examinar su contenido sin publicarlo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error 'https://raw.githubusercontent.com/GenRubiio/boombang-html5/main/api/public/uploads.zip' -o "$RUNNER_TEMP/uploads.zip"
          python3 - <<'PY'
          import collections, hashlib, os, re, subprocess, zipfile
          path = os.path.join(os.environ['RUNNER_TEMP'], 'uploads.zip')
          expected = 'c6449036b3ab262a0bb34c275b4a701588d7e900'
          actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
          print('Coincide exactamente con Git del original:', actual == expected)
          if actual != expected: raise SystemExit('El ZIP descargado no coincide con el original')
          categories = collections.Counter()
          risks = collections.Counter()
          count = 0
          total = 0
          for entry in zipfile.ZipFile(path).infolist():
              if entry.is_dir(): continue
              count += 1
              total += entry.file_size
              name = entry.filename
              low = name.lower()
              ext = os.path.splitext(low)[1] or '(sin extension)'
              categories[ext] += 1
              if low.startswith('/') or '..' in name.replace('\\','/').split('/'): risks['rutas inseguras'] += 1
              if entry.flag_bits & 1: risks['archivos cifrados'] += 1
              if entry.file_size > 75_000_000: risks['entradas muy grandes'] += 1
              if entry.compress_size and entry.file_size/entry.compress_size > 500: risks['expansion anomala'] += 1
              if ext in ('.env','.pem','.key','.p12','.pfx','.sql','.db','.sqlite','.sqlite3','.p8','.kdbx','.zip','.7z','.rar'): risks['tipos potencialmente sensibles'] += 1
              if re.search(r'(password|secret|private.?key|token|credential|\.env|session|backup|passport|id_card)',low): risks['nombres potencialmente sensibles'] += 1
              if ext in ('.txt','.json','.xml','.csv','.ini','.cfg','.log','.php','.js','.yaml','.yml','.html','.htm') and entry.file_size < 2_000_000:
                  with zipfile.ZipFile(path).open(entry) as src: sample = src.read(2_000_000)
                  if re.search(rb'-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|(?:app_key|api_key|secret_key|password)\s*[:=]', sample, re.I): risks['credenciales en texto'] += 1
                  if re.search(rb'\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b', sample): risks['correos en texto'] += 1
              if ext in ('.jpg','.jpeg','.tif','.tiff') and entry.file_size < 5_000_000:
                  with zipfile.ZipFile(path).open(entry) as src: head = src.read(300_000)
                  if b'Exif\x00\x00' in head: risks['imagenes con metadatos EXIF'] += 1
          print('Archivos internos:',count)
          print('Tamano total descomprimido (bytes):',total)
          print('Extensiones (conteos, sin revelar nombres):', dict(categories.most_common(30)))
          print('Alertas (conteos, sin revelar datos):',dict(risks))
          print('La auditoria no modifica el repositorio ni publica el contenido del ZIP.')
          PY
