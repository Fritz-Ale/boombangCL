name: Incorporar SQL y RND originales al repositorio privado
on:
  push:
    paths:
      - '.github/workflows/incorporar-archivos-pendientes-boombangcl.yml'
permissions:
  contents: write
jobs:
  importar:
    if: github.repository == 'Fritz-Ale/boombangCL'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar rama main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Comprobar privacidad, integridad y copiar archivos originales
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_private="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')"
          if [ "$repo_private" != 'true' ]; then
            echo 'ERROR: Repositorio no privado; no se copiaran datos potencialmente sensibles.'
            exit 1
          fi
          if [ -e 'boombang_api.sql' ] || [ -e 'api/.rnd' ]; then
            echo 'ERROR: Uno de los archivos ya existe. Se detiene para evitar sobrescrituras.'
            exit 1
          fi
          mkdir -p api
          curl --fail --location --retry 3 --silent --show-error 'https://raw.githubusercontent.com/GenRubiio/boombang-html5/main/boombang_api.sql' -o boombang_api.sql
          curl --fail --location --retry 3 --silent --show-error 'https://raw.githubusercontent.com/GenRubiio/boombang-html5/main/api/.rnd' -o api/.rnd
          expected_sql='3ea631aa6aebfaed69eb71032edbcb42a9d110bc'
          expected_rnd='11daa2ff3584b46a0720d9fae96bc30467be8770'
          actual_sql="$(git hash-object boombang_api.sql)"
          actual_rnd="$(git hash-object api/.rnd)"
          if [ "$actual_sql" != "$expected_sql" ] || [ "$actual_rnd" != "$expected_rnd" ]; then
            rm -f boombang_api.sql api/.rnd
            echo 'ERROR: Al menos un archivo no coincide con el original; no se subio nada.'
            exit 1
          fi
          echo 'Ambos archivos coinciden byte por byte con el repositorio original.'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- boombang_api.sql api/.rnd
          git diff --cached --quiet && { echo 'No se detectaron archivos nuevos'; exit 1; }
          git commit -m 'Agregar boombang_api.sql y api/.rnd originales al repositorio privado'
          git push origin HEAD:main
