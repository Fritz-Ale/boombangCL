name: API security and PHP compatibility

on:
  pull_request:
    paths:
      - 'api/app/Http/Middleware/VerifyEmulatorToken.php'
      - 'api/config/database.php'
      - 'api/routes/api.php'
      - 'api/tests/Standalone/**'
      - '.github/workflows/api-security-php.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
          coverage: none
      - name: Syntax verification
        run: |
          php -l api/app/Http/Middleware/VerifyEmulatorToken.php
          php -l api/config/database.php
          php -l api/routes/api.php
          php -l api/tests/Standalone/verify-emulator-token.php
          php -l api/tests/Standalone/database-config.php
      - name: Validate emulator authentication
        run: php api/tests/Standalone/verify-emulator-token.php
      - name: Validate PDO SSL configuration without deprecations
        run: php api/tests/Standalone/database-config.php
      - name: Ensure production test route is gated
        run: |
          grep -F "if (app()->environment(['local', 'testing']))" api/routes/api.php
