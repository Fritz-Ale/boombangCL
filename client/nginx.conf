server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The client runs on Nginx, not on Vite's development server.
    # Browser requests for uploaded images must reach the Laravel service.
    location ^~ /uploads/ {
        proxy_pass http://api:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Laravel public storage resources, when used by the game.
    location ^~ /storage/ {
        proxy_pass http://api:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Keep SPA navigation working on direct reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
